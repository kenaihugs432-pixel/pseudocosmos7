<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AR — WebXR (Android) + Quick Look (iOS)</title>

  <style>
    html, body { height: 100%; }

    body{
      margin:0;
      overflow:hidden;
      background:#000;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    #message{
      position:fixed;
      left:10px;
      top:calc(10px + env(safe-area-inset-top));
      z-index:30;
      background:#fff;
      color:#000;
      padding:8px 10px;
      border-radius:6px;
      box-shadow:0 2px 10px rgba(0,0,0,.2);
      max-width:calc(100% - 24px);
      font-size:14px;
      line-height:1.35;
    }

    #errorBox{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom));
      z-index:31;
      display:none;
      max-height:38vh;
      overflow:auto;
      background:rgba(0,0,0,.85);
      color:#fff;
      padding:10px;
      border-radius:6px;
      font-family:ui-monospace,SFMono-Regular,monospace;
      font-size:12px;
      line-height:1.45;
      white-space:pre-wrap;
    }

    model-viewer{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      background:#111;
    }

    /* O botao do Quick Look. O conteudo visual eh a propria <img>,
       porque a Apple exige que o <a rel="ar"> tenha exatamente um filho <img>. */
    #ar-link{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:calc(28px + env(safe-area-inset-bottom));
      z-index:40;
      display:block;
      line-height:0;
      filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));
    }

    #ar-link img{
      display:block;
      width:220px;
      height:52px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.154.0/"
    }
  }
  </script>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div id="message">Iniciando…</div>
  <div id="errorBox"></div>

  <script type="module">
  const GLB  = 'aha2.glb';
  const USDZ = 'aha2.usdz';

  // Altura desejada em metros. ATENCAO: isso so vale para o caminho WebXR.
  // No iOS o tamanho vem de dentro do proprio USDZ.
  const TARGET_MODEL_HEIGHT = 0.20;

  const msgEl = document.getElementById('message');
  const errEl = document.getElementById('errorBox');

  const setMessage = (m) => { msgEl.textContent = m; };

  const log = (t) => {
    errEl.style.display = 'block';
    errEl.textContent += t + '\n';
    console.log(t);
  };

  const showError = (t) => { log('[erro] ' + t); console.error(t); };

  // iPadOS 13+ se identifica como Mac, por isso o teste de maxTouchPoints.
  function isIOS(){
    const ua = navigator.userAgent;
    return /iPad|iPhone|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  }

  async function head(url){
    try{
      const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      return {
        ok: r.ok,
        status: r.status,
        type: r.headers.get('content-type') || '(sem content-type)'
      };
    }catch(e){
      return { ok:false, status:0, type:String(e) };
    }
  }

  function arButtonImage(){
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52">' +
        '<rect width="220" height="52" rx="14" fill="#0b84ff"/>' +
        '<text x="110" y="33" text-anchor="middle" fill="#ffffff" ' +
              'font-family="-apple-system,Helvetica,Arial,sans-serif" ' +
              'font-size="17" font-weight="600">Ver em AR</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ------------------------------------------------------------------ */
  /* iOS — AR Quick Look                                                 */
  /* Precisa vir ANTES de qualquer import dinamico, senao uma falha ao   */
  /* baixar o three.js impede o botao de AR de ser criado.               */
  /* ------------------------------------------------------------------ */
  async function startQuickLook(){
    setMessage('iOS detectado — verificando arquivos…');

    const glb  = await head(GLB);
    const usdz = await head(USDZ);

    log('Diagnostico iOS');
    log('  WebXR: ' + ('xr' in navigator
      ? 'navigator.xr existe, mas immersive-ar nao e suportado no iOS'
      : 'ausente — Safari iOS nao tem WebXR'));
    log('  ' + GLB  + ': ' + (glb.ok  ? 'OK' : 'FALTANDO (HTTP ' + glb.status  + ')') + '  ' + glb.type);
    log('  ' + USDZ + ': ' + (usdz.ok ? 'OK' : 'FALTANDO (HTTP ' + usdz.status + ')') + '  ' + usdz.type);

    if (usdz.ok && !/usdz/i.test(usdz.type)){
      log('  aviso: o content-type do USDZ nao e model/vnd.usdz+zip.');
      log('  Se o Quick Look nao abrir, esse costuma ser o motivo.');
    }

    // Visualizador inline. Serve de preview e tem o proprio botao de AR.
    const mv = document.createElement('model-viewer');
    if (glb.ok)  mv.setAttribute('src', GLB);
    if (usdz.ok) mv.setAttribute('ios-src', new URL(USDZ, location.href).href);
    mv.setAttribute('ar', '');
    mv.setAttribute('ar-modes', 'quick-look');   // webxr e scene-viewer nao existem no iOS
    mv.setAttribute('camera-controls', '');
    mv.setAttribute('autoplay', '');             // toca a animacao do GLB no preview
    mv.setAttribute('shadow-intensity', '1');
    mv.setAttribute('touch-action', 'pan-y');
    document.body.appendChild(mv);

    if (!usdz.ok){
      setMessage('Falta ' + USDZ + '. No iOS o AR so abre com USDZ.');
      return;
    }

    // Link nativo do Quick Look.
    // REGRA DA APPLE: o <a rel="ar"> precisa conter exatamente um filho <img>.
    // Sem a <img>, o Safari apenas baixa o arquivo em vez de abrir o AR.
    const a = document.createElement('a');
    a.id = 'ar-link';
    a.setAttribute('rel', 'ar');
    a.href = new URL(USDZ, location.href).href;

    const img = document.createElement('img');
    img.alt = 'Ver em AR';
    img.src = arButtonImage();
    a.appendChild(img);

    document.body.appendChild(a);

    setMessage('Toque em "Ver em AR" para abrir o Quick Look.');
  }

  /* ------------------------------------------------------------------ */
  /* Android / Chrome — WebXR                                            */
  /* ------------------------------------------------------------------ */
  async function startWebXR(){
    let arSupported = false;
    try{
      arSupported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar'));
    }catch(e){ /* ignora */ }

    if (!arSupported){
      log('immersive-ar nao suportado neste navegador. Use Chrome no Android com o Google Play Services for AR instalado.');
    }

    const glb = await head(GLB);
    if (!glb.ok){
      showError(GLB + ' nao encontrado (HTTP ' + glb.status + ')');
      setMessage(GLB + ' nao encontrado.');
      return;
    }

    let THREE, GLTFLoaderModule, ARButtonModule, SkeletonUtilsModule;
    try{
      THREE               = await import('three');
      GLTFLoaderModule    = await import('https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js');
      ARButtonModule      = await import('https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/webxr/ARButton.js');
      SkeletonUtilsModule = await import('https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/utils/SkeletonUtils.js');
    }catch(err){
      showError('Falha ao carregar libs: ' + err +
                '\nNavegadores sem suporte a import maps (Safari < 16.4) falham aqui.');
      setMessage('Erro carregando libs.');
      return;
    }

    const { GLTFLoader } = GLTFLoaderModule;
    const { ARButton }   = ARButtonModule;
    const SkeletonUtils  = SkeletonUtilsModule.SkeletonUtils || SkeletonUtilsModule.default || SkeletonUtilsModule;

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    if ('outputColorSpace' in renderer && THREE.SRGBColorSpace){
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } else if ('outputEncoding' in renderer){
      renderer.outputEncoding = THREE.sRGBEncoding;
    }

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

    scene.add(new THREE.AmbientLight(0xffffff, 1.15));
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ff88 })
    );
    reticle.visible = false;
    reticle.matrixAutoUpdate = false;
    scene.add(reticle);

    try{
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      const tl = new THREE.TextureLoader();
      const envUrl = 'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg';
      const envTex = await new Promise((res, rej) => tl.load(envUrl, res, undefined, rej));
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      if ('colorSpace' in envTex && THREE.SRGBColorSpace){
        envTex.colorSpace = THREE.SRGBColorSpace;
      } else if ('encoding' in envTex){
        envTex.encoding = THREE.sRGBEncoding;
      }
      scene.environment = pmrem.fromEquirectangular(envTex).texture;
      envTex.dispose();
      pmrem.dispose();
    }catch(e){
      console.warn('Env falhou (nao critico):', e);
    }

    let baseGLTF = null;
    let modelPrototype = null;
    let modelReady = false;
    let placedRoot = null;
    let placedAnchor = null;
    let pendingPlace = false;

    const mixers = [];
    const clock = new THREE.Clock();
    const tmpMatrix = new THREE.Matrix4();

    new GLTFLoader().load(
      GLB,
      (gltf) => {
        baseGLTF = gltf;
        modelPrototype = gltf.scene;

        const size = new THREE.Vector3();
        new THREE.Box3().setFromObject(modelPrototype).getSize(size);

        if (size.y > 0){
          const realScale = TARGET_MODEL_HEIGHT / size.y;
          modelPrototype.scale.setScalar(realScale);
          console.log('Altura original:', size.y, '— escala:', realScale);
        }

        modelPrototype.traverse((n) => {
          if (n.isMesh && n.material){
            n.material.side = THREE.DoubleSide;
            n.material.needsUpdate = true;
          }
        });

        modelReady = true;
        setMessage('Modelo carregado. Toque em uma superficie para posicionar.');
      },
      undefined,
      (err) => showError('Erro carregando ' + GLB + ': ' + err)
    );

    try{
      document.body.appendChild(
        ARButton.createButton(renderer, {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['anchors', 'local-floor']
        })
      );
    }catch(e){
      showError('Erro criando botao AR: ' + e);
    }

    const controller = renderer.xr.getController(0);
    scene.add(controller);

    // Um XRHitTestResult so e valido dentro do frame em que foi obtido.
    // Por isso o toque apenas marca a intencao; a colocacao acontece no
    // proximo frame, com um resultado fresco.
    controller.addEventListener('select', () => {
      if (!modelReady){ setMessage('Modelo ainda carregando…'); return; }
      if (placedRoot) return;
      if (!reticle.visible){ setMessage('Aponte para uma superficie primeiro.'); return; }
      pendingPlace = true;
    });

    function place(hit, matrix){
      const root = new THREE.Group();
      root.matrixAutoUpdate = false;
      root.matrix.copy(matrix);

      const clone = (SkeletonUtils && typeof SkeletonUtils.clone === 'function')
        ? SkeletonUtils.clone(modelPrototype)
        : modelPrototype.clone(true);

      root.add(clone);
      scene.add(root);
      placedRoot = root;

      if (baseGLTF && baseGLTF.animations && baseGLTF.animations.length){
        const mixer = new THREE.AnimationMixer(clone);
        baseGLTF.animations.forEach((clip) => mixer.clipAction(clip).play());
        mixers.push(mixer);
      }

      setMessage('Modelo posicionado.');

      if (typeof hit.createAnchor === 'function'){
        hit.createAnchor()
          .then((anchor) => { placedAnchor = anchor; setMessage('Modelo ancorado no mundo real.'); })
          .catch((e) => console.warn('Anchor falhou (nao critico):', e));
      }
    }

    let hitTestSource = null;
    let hitTestRequested = false;

    renderer.xr.addEventListener('sessionend', () => {
      hitTestSource = null;
      hitTestRequested = false;
      reticle.visible = false;
      pendingPlace = false;
    });

    renderer.setAnimationLoop((_, frame) => {
      const delta = clock.getDelta();
      for (const m of mixers) m.update(delta);

      if (frame){
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (session && !hitTestRequested){
          hitTestRequested = true;
          session.requestReferenceSpace('viewer')
            .then((viewerSpace) => session.requestHitTestSource({ space: viewerSpace }))
            .then((src) => { hitTestSource = src; })
            .catch((e) => console.warn('hit-test source falhou', e));
        }

        if (hitTestSource && referenceSpace){
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0){
            const hit = results[0];
            const pose = hit.getPose(referenceSpace);

            if (pose){
              tmpMatrix.fromArray(pose.transform.matrix);
              reticle.matrix.copy(tmpMatrix);
              reticle.visible = true;

              if (pendingPlace){
                pendingPlace = false;
                place(hit, tmpMatrix);
              }
            } else {
              reticle.visible = false;
            }
          } else {
            reticle.visible = false;
          }
        }

        if (placedAnchor && placedRoot && referenceSpace && typeof frame.getPose === 'function'){
          try{
            const anchorPose = frame.getPose(placedAnchor.anchorSpace, referenceSpace);
            if (anchorPose){
              tmpMatrix.fromArray(anchorPose.transform.matrix);
              placedRoot.matrix.copy(tmpMatrix);   // so posicao/rotacao; a escala vive no clone
            }
          }catch(e){
            console.warn('Falha ao atualizar anchor:', e);
          }
        }
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  if (isIOS()) startQuickLook(); else startWebXR();
  </script>
</body>
</html>
